name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Cài Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.1" virtualenv

      - name: Cache Buildozer (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
           run: |
             yes | buildozer -v android debug 2>&1 | tee build.log
             exit ${PIPESTATUS[1]}

         - name: TOM TAT LOI (copy phan nay gui lai)
           if: failure()
           run: |
             echo "=========== CAC DONG CO CHU ERROR ==========="
             grep -n -iE "error:|error |failed|exception|traceback|No such file|not found" build.log \
               | grep -v -- "-Werror" | tail -40 || true
             echo "=========== 60 DONG CUOI ==========="
             tail -60 build.log | cut -c1-400

         - name: Tai log day du
           if: failure()
           uses: actions/upload-artifact@v4
           with:
             name: build-log
             path: build.log

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: phien-dich-anh-viet-apk
          path: bin/*.apk
